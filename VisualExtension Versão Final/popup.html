<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro de Cores para Daltonismo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js"></script>
</head>
<body>
  <div class="container">
    <h1>Selecione o tipo de daltonismo:</h1>
    <select id="colorblindnessType">
      <option value="acromatopsia">Acromatopsia</option>
      <option value="acromatomalia">Acromatomalia</option>
      <option value="deuteranomalia">Deuteranomalia</option>
      <option value="deuteranopia">Deuteranopia</option>
      <option value="monocromacia">Monocromacia</option>
      <option value="protanomalia">Protanomalia</option>
      <option value="protanopia">Protanopia</option>
      <option value="tritanomalia">Tritanomalia</option>
      <option value="tritanopia">Tritanopia</option>
    </select>
    <button id="applyFilterButton">Aplicar Filtro</button>
  </div>
</body>
</html>
